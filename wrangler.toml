name = "silk-icons-browser"
main = "src/worker/index.ts"
compatibility_date = "2026-10-19"

# The static site is uploaded with the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"

# The global copy counter. A Durable Object needs no provisioning: the class
# is created with the first deploy.
[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]

[observability]
enabled = true
